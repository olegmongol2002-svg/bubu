name: Telegram alerts

# Каждые 15 минут проверяет пулы metric.xyz и шлёт в Telegram новые пулы с высоким APR.
# Настройка: Settings → Secrets and variables → Actions
#   Secrets:   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   Variables (необязательно): MIN_TVL (по умолч. 10000), ALERT_APR (300), SORT (apr24h),
#                              COOLDOWN_HOURS (24), EXTRA_ARGS (напр. "--chain 1 --no-allowlist")

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Файл с тем, о каких пулах уже сообщали, живёт в кеше между запусками
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: alerts-state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Check pools and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 metric_pools.py --telegram --state alerts-state.json \
            --min-tvl "${{ vars.MIN_TVL || '10000' }}" \
            --alert-apr "${{ vars.ALERT_APR || '300' }}" \
            --sort "${{ vars.SORT || 'apr24h' }}" \
            --cooldown "${{ vars.COOLDOWN_HOURS || '24' }}" \
            ${{ vars.EXTRA_ARGS }}

      - name: Save alert state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: alerts-state.json
          key: alerts-state-${{ github.run_id }}
