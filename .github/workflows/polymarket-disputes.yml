name: Polymarket disputes

# Каждые 15 минут ищет спорные и ошибочно резолвящиеся рынки Polymarket и шлёт новые находки в Telegram.
# Настройка: Settings → Secrets and variables → Actions
#   Secrets:   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (те же, что для пулов)
#   Variables (необязательно): PM_ALERT_KINDS (по умолч. WRONG_PROPOSAL,CHEAP_WINNER,DISPUTED,LADDER),
#                              PM_EXTRA_ARGS (напр. "--max-ask 0.95 --days 5")

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: polymarket-disputes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: disputes-state.json
          key: disputes-state-${{ github.run_id }}
          restore-keys: disputes-state-

      - name: Scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 polymarket_disputes.py --telegram --state disputes-state.json \
            --alert-kinds "${{ vars.PM_ALERT_KINDS || 'WRONG_PROPOSAL,CHEAP_WINNER,DISPUTED,LADDER' }}" \
            ${{ vars.PM_EXTRA_ARGS }}

      - name: Save alert state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: disputes-state.json
          key: disputes-state-${{ github.run_id }}
